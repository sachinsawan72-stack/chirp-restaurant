<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chap House | Movie Time Cinemas</title>

    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================================
           BODY
        ========================================= */

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(245,179,1,.12),
                    transparent 30%
                ),

                radial-gradient(
                    circle at bottom right,
                    rgba(102,126,234,.15),
                    transparent 35%
                ),

                #0b0b0b;

            color: white;

            min-height: 100vh;

            overflow-x: hidden;
        }


        /* =========================================
           ANIMATED BACKGROUND
        ========================================= */

        body::before {
            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background: #f5b301;

            filter: blur(180px);

            opacity: .04;

            top: -200px;
            left: -200px;

            pointer-events: none;

            animation:
                backgroundMove
                12s
                ease-in-out
                infinite
                alternate;
        }


        @keyframes backgroundMove {

            from {
                transform:
                    translate(0,0);
            }

            to {
                transform:
                    translate(
                        200px,
                        150px
                    );
            }

        }


        /* =========================================
           HEADER
        ========================================= */

        header {

            position: relative;

            overflow: hidden;

            text-align: center;

            padding:
                45px
                20px
                35px;

            background:

                linear-gradient(
                    135deg,
                    #111,
                    #1c1c1c,
                    #111
                );

            border-bottom:
                1px
                solid
                #333;

        }


        /* HEADER GLOW */

        header::before {

            content: "";

            position: absolute;

            width: 350px;
            height: 350px;

            background: #f5b301;

            filter: blur(150px);

            opacity: .08;

            top: -200px;

            left: 50%;

            transform:
                translateX(-50%);

        }


        .brand {

            position: relative;

            z-index: 2;

            animation:
                headerAppear
                1s
                ease;

        }


        @keyframes headerAppear {

            from {

                opacity: 0;

                transform:
                    translateY(-20px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        .logo {

            font-size: 46px;

            font-weight: 900;

            letter-spacing: 2px;

        }


        .logo span {

            color: #f5b301;

            text-shadow:

                0 0 20px
                rgba(
                    245,
                    179,
                    1,
                    .25
                );

        }


        .tagline {

            margin-top: 10px;

            color: #aaa;

            font-size: 16px;

            letter-spacing: 1px;

        }


        .location {

            margin-top: 15px;

            color: #ccc;

            font-size: 14px;

        }


        /* =========================================
           NAVIGATION
        ========================================= */

        nav {

            position: sticky;

            top: 0;

            z-index: 1000;

            background:
                rgba(
                    18,
                    18,
                    18,
                    .95
                );

            backdrop-filter:
                blur(15px);

            border-bottom:
                1px
                solid
                #333;

        }


        .category-container {

            max-width: 1200px;

            margin: auto;

            padding:
                15px
                20px;

            display: flex;

            gap: 12px;

            overflow-x: auto;

            scrollbar-width: none;

        }


        .category-container::-webkit-scrollbar {

            display: none;

        }


        .filter-btn {

            padding:
                10px
                22px;

            border:
                1px
                solid
                #383838;

            border-radius: 30px;

            background:
                #242424;

            color:
                #ddd;

            cursor: pointer;

            white-space: nowrap;

            font-size: 14px;

            font-weight: bold;

            transition:
                all
                .3s
                cubic-bezier(
                    .2,
                    .8,
                    .2,
                    1
                );

        }


        .filter-btn:hover {

            background:
                #333;

            transform:
                translateY(-2px)
                scale(1.03);

        }


        .filter-btn.active {

            background:
                #f5b301;

            color:
                #111;

            border-color:
                #f5b301;

            box-shadow:

                0 5px
                20px
                rgba(
                    245,
                    179,
                    1,
                    .2
                );

        }


        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .container {

            max-width:
                1200px;

            margin:
                auto;

            padding:
                35px
                20px
                70px;

        }


        /* =========================================
           SEARCH BOX
        ========================================= */

        .search-box {

            display: flex;

            justify-content: center;

            margin-bottom:
                40px;

        }


        #searchInput {

            width:
                100%;

            max-width:
                650px;

            padding:
                17px
                24px;

            border-radius:
                35px;

            border:
                1px
                solid
                #333;

            background:
                rgba(
                    35,
                    35,
                    35,
                    .9
                );

            color:
                white;

            outline:
                none;

            font-size:
                15px;

            transition:
                all
                .3s
                ease;

        }


        #searchInput::placeholder {

            color:
                #777;

        }


        #searchInput:focus {

            transform:
                scale(1.015);

            border-color:
                #f5b301;

            box-shadow:

                0 0 0
                4px
                rgba(
                    245,
                    179,
                    1,
                    .08
                ),

                0 15px
                40px
                rgba(
                    0,
                    0,
                    0,
                    .5
                );

        }


        /* =========================================
           MENU GRID
        ========================================= */

        .menu-grid {

            display:
                grid;

            grid-template-columns:

                repeat(
                    auto-fill,
                    minmax(
                        260px,
                        1fr
                    )
                );

            gap:
                25px;

        }


        /* =========================================
           MENU CARD
        ========================================= */

        .menu-item {

            position:
                relative;

            background:

                linear-gradient(
                    145deg,
                    #202020,
                    #171717
                );

            border-radius:
                20px;

            overflow:
                hidden;

            border:
                1px
                solid
                #292929;

            opacity:
                0;

            transform:
                translateY(35px);

            animation:

                cardAppear
                .6s
                ease
                forwards;

            transition:

                transform
                .4s
                ease,

                box-shadow
                .4s
                ease,

                border-color
                .4s
                ease;

        }


        @keyframes cardAppear {

            to {

                opacity:
                    1;

                transform:
                    translateY(0);

            }

        }


        .menu-item:hover {

            transform:
                translateY(-10px);

            border-color:
                #f5b301;

            box-shadow:

                0
                20px
                50px
                rgba(
                    0,
                    0,
                    0,
                    .7
                ),

                0
                0
                25px
                rgba(
                    245,
                    179,
                    1,
                    .10
                );

        }


        /* =========================================
           IMAGE
        ========================================= */

        .menu-item-image {

            width:
                100%;

            height:
                240px;

            background:

                linear-gradient(
                    135deg,
                    #292929,
                    #151515
                );

            position:
                relative;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            overflow:
                hidden;

            font-size:
                70px;

        }


        .menu-item-image img {

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

            transition:

                transform
                .6s
                cubic-bezier(
                    .2,
                    .8,
                    .2,
                    1
                );

        }


        .menu-item:hover
        .menu-item-image img {

            transform:
                scale(1.12);

        }


        /* IMAGE CINEMATIC OVERLAY */

        .menu-item-image::after {

            content:
                "";

            position:
                absolute;

            inset:
                0;

            background:

                linear-gradient(

                    to top,

                    rgba(
                        0,
                        0,
                        0,
                        .55
                    ),

                    transparent
                    60%

                );

            pointer-events:
                none;

        }


        /* =========================================
           NOT AVAILABLE
           Blurred, greyed-out and un-clickable so
           customers can visually see it's off the
           menu right now and can't select it.
        ========================================= */

        .menu-item.unavailable {

            opacity: .5;

            filter: blur(1.5px) grayscale(35%);

            pointer-events: none;

        }


        .menu-item.unavailable:hover {

            transform: none;

            border-color: #292929;

            box-shadow: none;

        }


        .unavailable-badge {

            position:
                absolute;

            top:
                14px;

            right:
                14px;

            z-index:
                5;

            background:
                #d63031;

            color:
                white;

            padding:
                7px
                13px;

            border-radius:
                20px;

            font-size:
                11px;

            font-weight:
                bold;

            letter-spacing:
                .5px;

        }


        /* =========================================
           MENU CONTENT
        ========================================= */

        .menu-item-content {

            padding:
                20px;

        }


        .menu-item-category {

            display:
                inline-block;

            color:
                #f5b301;

            font-size:
                11px;

            font-weight:
                bold;

            letter-spacing:
                1.5px;

            text-transform:
                uppercase;

            margin-bottom:
                9px;

        }


        .menu-item-bottom {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                10px;

        }


        .menu-item h3 {

            font-size:
                19px;

            color:
                white;

            line-height:
                1.4;

        }


        /* =========================================
           PRICE
        ========================================= */

        .menu-item-price {

            color:
                #f5b301;

            font-size:
                21px;

            font-weight:
                bold;

            white-space:
                nowrap;

            text-shadow:

                0
                0
                15px
                rgba(
                    245,
                    179,
                    1,
                    .3
                );

        }


        /* =========================================
           DESCRIPTION
        ========================================= */

        .menu-item-description {

            margin-top:
                10px;

            color:
                #888;

            font-size:
                13px;

            line-height:
                1.6;

        }


        /* =========================================
           NO RESULTS
        ========================================= */

        .no-results {

            display:
                none;

            text-align:
                center;

            padding:
                70px
                20px;

            background:
                #191919;

            border-radius:
                20px;

            border:
                1px
                solid
                #292929;

            color:
                #999;

        }


        .no-results h2 {

            color:
                white;

            margin-bottom:
                10px;

        }


        /* =========================================
           FOOTER
        ========================================= */

        footer {

            background:
                #111;

            border-top:
                1px
                solid
                #292929;

            text-align:
                center;

            padding:
                35px
                20px;

            color:
                #777;

            font-size:
                14px;

        }


        footer p {

            margin:
                8px
                0;

        }


        /* =========================================
           MOBILE DESIGN
        ========================================= */

        @media(
            max-width: 600px
        ) {

            header {

                padding:
                    30px
                    15px;

            }


            .logo {

                font-size:
                    30px;

            }


            .tagline {

                font-size:
                    13px;

            }


            .location {

                font-size:
                    12px;

                line-height:
                    1.6;

            }


            .container {

                padding:
                    25px
                    12px
                    50px;

            }


            .search-box {

                margin-bottom:
                    25px;

            }


            #searchInput {

                padding:
                    14px
                    18px;

            }


            .menu-grid {

                grid-template-columns:

                    repeat(
                        2,
                        1fr
                    );

                gap:
                    14px;

            }


            .menu-item {

                border-radius:
                    15px;

            }


            .menu-item-image {

                height:
                    150px;

                font-size:
                    50px;

            }


            .menu-item-content {

                padding:
                    12px;

            }


            .menu-item-category {

                font-size:
                    9px;

                margin-bottom:
                    6px;

            }


            .menu-item-bottom {

                display:
                    block;

            }


            .menu-item h3 {

                font-size:
                    14px;

                margin-bottom:
                    7px;

            }


            .menu-item-price {

                font-size:
                    16px;

            }


            .menu-item-description {

                display:
                    none;

            }


            .filter-btn {

                padding:
                    8px
                    16px;

                font-size:
                    12px;

            }

        }

    </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

    <div class="brand">

        <div class="logo">

            🐦
            <span>
                CHAP HOUSE 
            </span>

        </div>


        <div class="tagline">

            By Movie Time Cinemas
            •
             For All Day

        </div>


        <div class="location">

            📍 SLN Terminus Mall,
            3rd Floor,
            Gachibowli,
            Hyderabad,
            Telangana - 500032

        </div>

    </div>

</header>



<!-- =========================================
     CATEGORY NAVIGATION
========================================= -->

<nav>

    <div
        class="category-container"
        id="filterContainer"
    >

        <button
            class="filter-btn active"
            data-category="all"
        >

            All Items

        </button>

    </div>

</nav>



<!-- =========================================
     MAIN MENU
========================================= -->

<main
    class="container"
>


    <!-- SEARCH -->

    <div
        class="search-box"
    >

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search your favourite food..."
        >

    </div>



    <!-- MENU GRID -->

    <div
        class="menu-grid"
        id="menuGrid"
    >

    </div>



    <!-- NO RESULTS -->

    <div
        class="no-results"
        id="noResults"
    >

        <h2>
            No Items Found
        </h2>

        <p>
            Try searching for something else.
        </p>

    </div>


</main>



<!-- =========================================
     FOOTER
========================================= -->

<footer>

    <p>

        © 2026
        Chap House
        By Movie Time Cinemas

    </p>


    <p>

        📍 SLN Terminus Mall,
        3rd Floor,
        Gachibowli,
        Hyderabad

    </p>


    <p>

        📞 +91 9515105007

    </p>

</footer>



<script>


/* =========================================
   MENU DATA
========================================= */

let menuItems = [];


/* =========================================
   FALLBACK MENU

   Agar backend temporarily available nahi hai
   to demo menu show hoga.
========================================= */

const FALLBACK_MENU = [

    {
        id: 1,
        name: "Chicken Chap",
        category: "Chicken",
        price: 199,
        description:
            "Delicious and flavourful chicken chap",
        emoji: "🍗",
        image: "",
        available: true
    },

    {
        id: 2,
        name: "Chicken Wings",
        category: "Chicken",
        price: 249,
        description:
            "Crispy and spicy chicken wings",
        emoji: "🍗",
        image: "",
        available: true
    },

    {
        id: 3,
        name: "Chicken Burger",
        category: "Burgers",
        price: 179,
        description:
            "Juicy chicken burger",
        emoji: "🍔",
        image: "",
        available: true
    },

    {
        id: 4,
        name: "Veg Burger",
        category: "Burgers",
        price: 149,
        description:
            "Fresh and delicious veg burger",
        emoji: "🍔",
        image: "",
        available: true
    },

    {
        id: 5,
        name: "Chicken Pizza",
        category: "Pizza",
        price: 299,
        description:
            "Loaded chicken pizza",
        emoji: "🍕",
        image: "",
        available: true
    },

    {
        id: 6,
        name: "Veg Pizza",
        category: "Pizza",
        price: 249,
        description:
            "Fresh vegetable pizza",
        emoji: "🍕",
        image: "",
        available: true
    },

    {
        id: 7,
        name: "French Fries",
        category: "Snacks",
        price: 99,
        description:
            "Crispy golden fries",
        emoji: "🍟",
        image: "",
        available: true
    },

    {
        id: 8,
        name: "Popcorn",
        category: "Snacks",
        price: 120,
        description:
            "Fresh cinema popcorn",
        emoji: "🍿",
        image: "",
        available: true
    },

    {
        id: 9,
        name: "Cold Coffee",
        category: "Beverages",
        price: 129,
        description:
            "Refreshing cold coffee",
        emoji: "🥤",
        image: "",
        available: true
    },

    {
        id: 10,
        name: "Fresh Lime Soda",
        category: "Beverages",
        price: 79,
        description:
            "Refreshing lime soda",
        emoji: "🍋",
        image: "",
        available: true
    }

];



/* =========================================
   DOM ELEMENTS
========================================= */

const menuGrid =
    document.getElementById(
        "menuGrid"
    );


const filterContainer =
    document.getElementById(
        "filterContainer"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const noResults =
    document.getElementById(
        "noResults"
    );



/* =========================================
   LOAD MENU FROM BACKEND

   Existing API:
   /api/menu
========================================= */

async function loadMenu() {

    try {

        const response =
            await fetch(

                `/api/menu?t=${Date.now()}`,

                {
                    cache:
                        "no-store"
                }

            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Menu API error"
            );

        }


        menuItems =
            await response.json();


        /*
        Agar API se empty menu aaye
        */

        if (
            !Array.isArray(menuItems)
        ) {

            menuItems =
                [];

        }

    }

    catch (
        error
    ) {

        console.log(
            "API unavailable. Fallback menu loading."
        );


        menuItems =
            FALLBACK_MENU;

    }


    buildCategoryFilters();


    displayMenuItems(
        menuItems
    );

}



/* =========================================
   BUILD CATEGORY FILTERS
========================================= */

function buildCategoryFilters() {

    const categories =

        [
            ...new Set(

                menuItems

                .map(
                    item =>
                    item.category
                )

                .filter(
                    Boolean
                )

            )
        ];


    filterContainer.innerHTML =

        `
        <button
            class="filter-btn active"
            data-category="all"
        >

            All Items

        </button>
        `

        +

        categories.map(

            category =>

            `
            <button
                class="filter-btn"
                data-category="${category}"
            >

                ${category}

            </button>
            `

        )

        .join(
            ""
        );



    const buttons =

        filterContainer
        .querySelectorAll(
            ".filter-btn"
        );



    buttons.forEach(

        button => {

            button.addEventListener(

                "click",

                function() {

                    buttons.forEach(

                        btn =>

                        btn.classList.remove(
                            "active"
                        )

                    );


                    this.classList.add(
                        "active"
                    );


                    searchInput.value =
                        "";


                    const category =

                        this.dataset
                        .category;


                    const filteredItems =

                        category === "all"

                        ?

                        menuItems

                        :

                        menuItems.filter(

                            item =>

                            item.category ===
                            category

                        );


                    displayMenuItems(
                        filteredItems
                    );

                }

            );

        }

    );

}



/* =========================================
   CHECK ITEM AVAILABILITY
========================================= */

function isItemAvailable(
    item
) {

    const value =
        item.available;


    if (
        value === false ||
        value === 0 ||
        value === "0" ||
        value === "false"
    ) {

        return false;

    }


    return true;

}



/* =========================================
   DISPLAY MENU

   VIEW ONLY

   NO CART
   NO ORDER
   NO CHECKOUT
========================================= */

function displayMenuItems(
    items
) {

    if (
        !items ||
        items.length === 0
    ) {

        menuGrid.style.display =
            "none";


        noResults.style.display =
            "block";


        return;

    }


    menuGrid.style.display =
        "grid";


    noResults.style.display =
        "none";


    menuGrid.innerHTML =

        items.map(

            (
                item,
                index
            ) => {

                const available =

                    isItemAvailable(
                        item
                    );


                const price =

                    Number(
                        item.price
                    );


                return `

                <div
                    class="
                        menu-item
                        ${available ? "" : "unavailable"}
                    "

                    style="
                        animation-delay:
                        ${index * 0.08}s
                    "
                >


                    <!-- IMAGE -->

                    <div
                        class="menu-item-image"
                    >

                        ${
                            item.image

                            ?

                            `
                            <img
                                src="${item.image}"
                                alt="${item.name}"

                                onerror="
                                    this.style.display='none';
                                "
                            >
                            `

                            :

                            `
                            <span>
                                ${item.emoji || "🍽️"}
                            </span>
                            `
                        }


                        ${
                            available

                            ?

                            ""

                            :

                            `
                            <div
                                class="unavailable-badge"
                            >

                                NOT AVAILABLE

                            </div>
                            `
                        }


                    </div>



                    <!-- CONTENT -->

                    <div
                        class="menu-item-content"
                    >


                        <!-- CATEGORY -->

                        <div
                            class="menu-item-category"
                        >

                            ${item.category || "Menu"}

                        </div>



                        <!-- NAME + PRICE -->

                        <div
                            class="menu-item-bottom"
                        >

                            <h3>

                                ${item.name || "Menu Item"}

                            </h3>


                            <div
                                class="menu-item-price"
                            >

                                ₹${
                                    isNaN(price)
                                    ?
                                    "0"
                                    :
                                    price.toFixed(0)
                                }

                            </div>


                        </div>



                        <!-- DESCRIPTION -->

                        ${
                            item.description

                            ?

                            `
                            <div
                                class="menu-item-description"
                            >

                                ${item.description}

                            </div>
                            `

                            :

                            ""
                        }


                    </div>


                </div>

                `;

            }

        )

        .join(
            ""
        );

}



/* =========================================
   SEARCH MENU
========================================= */

searchInput.addEventListener(

    "input",

    function() {

        const searchText =

            this.value

            .toLowerCase()

            .trim();


        const activeButton =

            document.querySelector(
                ".filter-btn.active"
            );


        const category =

            activeButton
            ?
            activeButton.dataset.category
            :
            "all";


        let filteredItems =

            category === "all"

            ?

            menuItems

            :

            menuItems.filter(

                item =>

                item.category ===
                category

            );



        filteredItems =

            filteredItems.filter(

                item => {

                    const name =

                        (
                            item.name ||
                            ""
                        )

                        .toLowerCase();


                    const description =

                        (
                            item.description ||
                            ""
                        )

                        .toLowerCase();


                    const itemCategory =

                        (
                            item.category ||
                            ""
                        )

                        .toLowerCase();


                    return (

                        name.includes(
                            searchText
                        )

                        ||

                        description.includes(
                            searchText
                        )

                        ||

                        itemCategory.includes(
                            searchText
                        )

                    );

                }

            );


        displayMenuItems(
            filteredItems
        );

    }

);



/* =========================================
   INITIALIZE MENU
========================================= */

loadMenu();


</script>

</body>
